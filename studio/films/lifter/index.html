  M.wire.emissiveIntensity = wg;
  const dimK = seg(t, T.d3 - .3, T.d3 + .3) * (1 - seg(t, END('d4'), END('d4') + .5));
  M.foilI.color.setScalar(1 - .6 * dimK).multiply(new THREE.Color('#dfe1e6')); M.foilI.envMapIntensity = 1 - .7 * dimK; M.balsaI.color.set('#d8b98a').multiplyScalar(1 - .6 * dimK); M.wireI.emissiveIntensity = .35 * (1 - dimK);
  hero.root.position.y += 70 * eio(seg(t, T.d3 - .3, T.d3 + .4)) * (1 - eio(seg(t, END('d4'), END('d4') + .6)));
  hero.glow.opacity += .14 * dimK; M.wire.emissiveIntensity += 1.0 * dimK;

  sheet.visible = shK > 0; sheet.position.set(60, 300 + 8 * Math.sin(t * 1.3), -260 - 300 * (1 - shK)); sheet.rotation.set(-.06, .62, .03);
  // --- ions + air in the gap (c4–c9)

  ions.visible = air.visible = gapOn;
  if (gapOn) {

      dummy.position.set(o.x + Math.sin(u * 9 + i) * 2, FY + WY - 2 - (WY - SK - 2) * u, o.z + Math.sin(i + u * 5) * 3); dummy.rotation.set(0, 0, 0);

  [0, 1, 2].forEach(k => sfx(X.sep + k * .17, 'lift', { gain: 1 - k * .2 }));
  [0, 1, 2].forEach((k, i) => sfx(at('c2', [0, .34, .66][i]), 'tick'));
  [2, 1, 0].forEach(k => sfx(X.close + (2 - k) * .12 + .85, 'land', { gain: k === 0 ? 1 : .7 }));
  sfx(at('c3', .45), 'pen'); sfx(T.c4 - .35, 'dive');
  sfx(X.ions - .6, 'hum', { d: T.c10 - X.ions + .4, gain: 1 });
  sfx(X.ions, 'crackle', { d: T.c10 - X.ions, gain: .8 });
  sfx(X.wind, 'wind', { d: T.c10 - X.wind + .3, gain: .8 });
  sfx(X.air4, 'tick'); sfx(T.c9 + .35, 'strike'); sfx(X.ionwind, 'stamp');
  sfx(T.c10 - .1, 'whoosh', { gain: 1, d: 1.2 });
  sfx(T.c10 + 1.3, 'pen'); sfx(at('c11', .55), 'pen');
  sfx(T.d1 - .35, 'whoosh', { gain: .8 }); sfx(T.d1, 'hit', { gain: 1 });
  TILE.forEach(c => { if (c.r < .3) sfx(X.tile + c.dCell / maxCell * .9, 'clack', { gain: .35 }); });
  for (let k = 0; k < 14; k++) sfx(X.wing + k / 14 * 1.1, 'clack', { gain: .3 });
  sfx(X.wing - .1, 'lift', { gain: .9 });
  [0, .55, .8].forEach(f => sfx(at('d3', f), 'tick')); [0, .55].forEach(f => sfx(at('d4', f), 'tick'));
  sfx(X.sink, 'lift', { gain: .5 });
  for (const [tt, fl] of [[X.tr1, X.flew1], [X.tr2, X.flew2], [X.tr3, X.flew3]]) { sfx(tt, 'hit', { gain: .9 }); if (fl !== X.flew3) sfx(fl, 'stamp'); }
  sfx(X.flew3, 'stamp', { gain: .55 });
  sfx(X.rise2, 'lift', { gain: .6 }); sfx(X.close3 + .2, 'whoosh', { gain: .6, d: 2.4 });
  for (let k = 0; k < 10; k++) sfx(X.close3 + 2.2 + k * .05, 'clack', { gain: .3 });
  sfx(T.e4 + .1, 'pen'); sfx(T.e6 + .4, 'pen');
  sfx(T.f1, 'hit', { gain: .8 }); sfx(X.climb, 'wind', { d: END('f4') - X.climb, gain: .7, fade: 1 });
  sfx(X.stall, 'stamp', { gain: .7 }); sfx(T.f5 - .4, 'dive');
  sfx(X.jar + .3, 'glass');
  sfx(X.verdict, 'stamp', { big: true }); sfx(T.g2 + .05, 'stamp', { gain: .6 }); sfx(T.g3 + .05, 'stamp', { gain: .7 });
  sfx(X.collapse, 'whoosh', { gain: 1, d: 1.2 }); sfx(X.collapse + .2, 'glass', { gain: .6 });
  for (let k = 0; k < 18; k++) sfx(X.collapse + .4 + k * .06, 'clack', { gain: .28 });
  sfx(X.collapse + 1.8, 'land', { gain: 1 });
  sfx(T.h1 + 1.6, 'pen'); sfx(T.h1 + 1.9, 'pen');
  sfx(X.endcard, 'hit', { gain: .8 });
  window.CUT = X;
}

// motion blur: up to 3 sub-frames on light shots, none while the 1,200-cell wing is in the scene (render budget)
await K.boot({ dur: DUR, build, update, marks, cam: camAt, mbMax: 3, mbAt: t => (t > X.tile - .2 && t < X.collapse + 2.4) ? 1 : 3 });
</script>
