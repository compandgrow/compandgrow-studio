// ================================================================ clocks: what each face reads at t
const NOON = 12 * 3600;
function clockState(t) {

  if (t >= X.tr1 - .2 && t < X.tr2 - .2) { const u = eio(seg(t, X.tr1 + .3, X.ok1 - .1)); o = u * 86400; i = u * 86399; ot = hms(o); it = hms(i); if (u >= 1) { ot = '24:00:00'; it = '23:59:59'; } }
  else if (t >= X.tr2 - .2 && t < X.tr3 - .2) { const u = eio(seg(t, X.tr2 + .3, X.ok2 - .1)); o = u * 86400; i = u * 82800; ot = hm(o); it = hm(i); if (u >= 1) { ot = '24:00'; it = '23:00'; } }

    if (t > X.pull) { ot = 'DAY 7'; it = 'DAY 1'; }

// bench clocks: B (raised) gains on A; drawn exaggerated during the drift, A slows in the well

  return { a: base - sink, b: base + gain };

  vol.visible = vk > .001; vol.position.y = 30 * (1 - vk); vol.scale.setScalar(Math.max(.001, vk));
  // she steps out (f5): the seated figure goes, a standing one appears outside the hatch
  const so = eo(seg(t, X.hatch + .9, X.hatch + 1.5)) * (1 - seg(t, X.pull - .2, X.pull + .3));
  out.visible = so > .001; out.scale.setScalar(Math.max(.001, so)); out.position.x = -130 - 40 * so;
  if (t > X.hatch + .9) { const v2 = 1 - seg(t, X.hatch + .9, X.hatch + 1.3); vol.visible = vol.visible && v2 > .001; vol.scale.setScalar(Math.max(.001, vk * v2)); }
  refPost.rotation.y = .3 - .8 * seg(t, X.hatch - .2, X.hatch + .4) * (1 - seg(t, X.pull, X.pull + 1.2));
  // hatch
  hatch.rotation.y = 100 * D2R * eio(seg(t, X.hatch, X.hatch + 1.1)) * (1 - eio(seg(t, X.pull, X.pull + 1.0)));
  lamp.intensity = 2.6e3 * (1 - .4 * seg(t, X.inside, X.inside + .8) * (1 - seg(t, END('f4'), END('f4') + .5)));
  return camAt(t);
}

// ================================================================ overlay marks
function wp(o, x, y, z) { const v = new THREE.Vector3(x, y, z); o.localToWorld(v); return v; }
const g = () => K.ov.getContext('2d');

  }

  // ---- c: the one dated beat
  if (bench.root.visible) {
    const bp = bench.root;
    dimension(t, { t0: X.lift + .5, t1: T.c3 - .1, A: wp(bp, 125, 80 + 33, 0), B: wp(bp, 125, 80 + 33 + 33, 0), ext: [[wp(bp, 30, 80 + 33, 0), wp(bp, 140, 80 + 33, 0)], [wp(bp, 112, 113 + 33, 0), wp(bp, 140, 113 + 33, 0)]], text: '≈ 33 cm', sub: 'about 1 foot', side: 1, id: 'cm33' });
    label(t, { t0: X.lift + .4, t1: X.drift + .1, a: proj(wp(CL.b.gp, 0, -45, 2)), lx: 640, ly: 520, name: '≈ 33 cm UP', spec: 'about 1 foot', id: 'up33' });
    K.textBlock(t, T.c2, T.c3 - .1, [{ text: '2010 · NIST · Science', px: 34, weight: 600, y: 330, family: MONO, col: DIM }, { text: 'TWO ATOMIC CLOCKS', px: 64, weight: 900, y: 420 }], { id: 'chip' });
    label(t, { t0: X.drift + .2, t1: T.c3 - .1, a: proj(wp(CL.b.gp, 0, 40, 2)), lx: 640, ly: 520, name: 'HIGHER', spec: 'runs faster', id: 'higher' });
    label(t, { t0: X.drift + .5, t1: T.c3 - .1, a: proj(wp(CL.a.gp, 0, 40, 2)), lx: 70, ly: 640, name: 'LOWER', spec: 'runs slower', id: 'lower' });
    // staircase: the higher figure
    if (stairs.visible) {
      label(t, { t0: T.c3 + .9, t1: T.c5 - .1, a: proj(wp(figs[1], 0, 124, 0)), lx: 640, ly: 640, name: 'AGES FASTER', spec: '2 steps up', id: 'faster' });
      label(t, { t0: T.c3 + 1.3, t1: T.c5 - .1, a: proj(wp(figs[0], 0, 124, 0)), lx: 400, ly: 700, name: 'BASE', spec: 'ground', align: 'right', id: 'base' });
    }
    K.textBlock(t, X.plate, T.c5 - .1, [{ text: '≈ 90 BILLIONTHS', px: 84, weight: 900, y: 330, col: ACC }, { text: 'OF A SECOND · OVER 79 YEARS', px: 38, weight: 600, y: 395, family: MONO }], { id: 'plate' });
    K.textBlock(t, T.c5, T.d1 - .2, [{ text: 'GRAVITY', px: 120, weight: 900, y: 380 }, { text: 'SLOWS TIME.', px: 120, weight: 900, y: 510, col: ACC }], { id: 'gst' });
    label(t, { t0: T.c6 + .2, t1: T.d1 - .2, a: proj(wp(CL.a.gp, -20, -30, 2)), lx: 540, ly: 1260, name: 'STRONGER GRAVITY', spec: 'slower clock', id: 'well' });
    // honesty tag: the raised clock's "+x s" readout is exaggerated (real effect ≈ 90 ns over 79 years)
    { const bs = benchState(t), p = proj(wp(CL.b.gp, 0, -78, 2));
      if (bs.b - bs.a > .05 && p[2] <= 1 && p[0] > 40 && p[0] < 1040 && p[1] > 200 && p[1] < 1420) {
        const c = g(); c.save(); c.globalAlpha = Math.min(1, (bs.b - bs.a - .05) * 4);
        c.font = `600 34px ${MONO}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
        const txt = 'SPED UP · NOT TO SCALE', w = c.measureText(txt).width;
        const x = clamp(p[0], 60 + w / 2 + 14, 1020 - w / 2 - 14), y = p[1] + 40;
        c.fillStyle = 'rgba(14,15,17,.85)'; c.fillRect(x - w / 2 - 14, y - 36, w + 28, 50);
        c.strokeStyle = ACC; c.lineWidth = 2; c.strokeRect(x - w / 2 - 14, y - 36, w + 28, 50);

      } }
  }
  // ---- d: the program (fiction)
  K.textBlock(t, T.d1 - .1, X.labels + .1, [
    { text: 'LONGHOUR', px: 150, weight: 900, y: 400, rule: 140 },
    { text: 'FILE 07 · AN INVENTED PROGRAM', px: 32, weight: 600, y: 480, col: DIM, family: MONO },
  ], { id: 'title' });
  const PL = [
    ['01', 'REFERENCE CLOCK', 'outside', () => wp(CL.out.gp, 0, 50, 2), 'l', 50, 600],
    ['02', 'CABIN CLOCK', 'inside', () => wp(CL.in.gp, 0, 30, 2), 'l', 600, 1150],
    ['03', 'MASS RING', 'dense, spinning', () => wp(ring, RING_R * .7, -RING_R * .7, 17), 'l', 600, 760],
    ['04', 'PRESSURE SHELL', 'sealed', () => wp(cab.shell, (R0) * Math.sin(150 * D2R), 300, R0 * Math.cos(150 * D2R)), 'l', 590, 560],
    ['05', 'SEAT', '', () => wp(cab.seat, 60, 60, 4), 'l', 600, 1320],
  ];
  PL.forEach(([i, n, s, a, al, lx, ly], k) => label(t, { t0: X.labels + k * .32, t1: X.close + .15, a: proj(a()), lx, ly, idx: i, name: n, spec: s, align: al === 'r' ? 'right' : 'left', id: 'p' + i }));
  label(t, { t0: X.spec, t1: END('d3') + .4, a: proj(wp(CL.in.gp, 0, 40, 2)), lx: 640, ly: 640, idx: '02', name: 'CABIN CLOCK', spec: '−1 s / day (spec)', id: 'spec' });
  // ---- e: trials (fiction): the card opens on the number
  const trial = (t0, t1, n, line) => K.textBlock(t, t0, t1, [{ text: 'TRIAL ' + n, px: 120, weight: 900, y: 380 }, { text: line, px: 36, weight: 600, y: 450, family: MONO, col: DIM }], { id: 'trial' + n });
  trial(X.tr1 - .05, X.tr2 - .1, '01', '24 hours · ring cruising');
  trial(X.tr2 - .05, X.tr3 - .1, '02', 'ring at full speed');
  trial(X.tr3 - .05, T.f1 - .1, '03', 'a volunteer · 1 day inside');
  const pair = (t0, t1) => { if (t < t0 || t > t1) return;
    label(t, { t0, t1, a: proj(wp(CL.in.gp, 0, -40, 2)), lx: 740, ly: 800, name: 'INSIDE', spec: cs.it, id: 'tin' + t0 });
    label(t, { t0: t0 + .1, t1, a: proj(wp(CL.out.gp, 0, -40, 2)), lx: 70, ly: 1090, name: 'OUTSIDE', spec: cs.ot, id: 'tout' + t0 }); };
  pair(X.tr1 + .3, X.tr2 - .1); pair(X.tr2 + .3, X.tr3 - .1); pair(X.tr3 + .3, T.f1 - .1);
  for (const [t0, t1, r] of [[X.ok1, X.tr2 - .1, -4], [X.ok2, X.tr3 - .1, 3], [X.ok3, T.f1 - .1, -3]]) stamp(t, { t0, t1, x: 540, y: 600, lines: ['CONFIRMED'], px: 104, rot: r, col: ACC });
  if (vol.visible) label(t, { t0: X.vol + .5, t1: X.ok3 - .1, a: proj(wp(vol, 40, 138, -26)), lx: 640, ly: 840, idx: '06', name: 'VOLUNTEER', spec: 'in 05 SEAT', id: 'vol' });
  // ---- f: the catch
  band(t, T.f1 - .05, END('f2') + .2); band(t, T.f4, T.f5 - .05);
  K.textBlock(t, T.f1 - .05, END('f2') + .2, [{ text: 'ONE CATCH', px: 120, weight: 900, y: 400 }], { id: 'catch' });
  slowTrio(t);
  K.textBlock(t, T.f4, T.f5 - .05, [{ text: 'NO EXTRA TIME', px: 96, weight: 900, y: 400, col: ACC }], { id: 'noextra' });
  label(t, { t0: X.hatch + .9, t1: X.verdict - .1, a: proj(wp(CL.out.gp, 0, -40, 2)), lx: 640, ly: 1180, name: 'OUTSIDE', spec: 'DAY 7', id: 'day7' });
  noBack(t);
  // ---- verdict
  stamp(t, { t0: X.verdict, t1: X.pull + .3, x: 540, y: 520, lines: ['CLEARED', 'ONE-WAY TRIP', 'TO THE FUTURE.'], px: 132, rot: -4, col: ACC, stagger: [X.verdict, T.f8 + .05, at('f8', .55)] });
  // ---- outro: the closed cabin, its dimensions, the end card
  if (t > X.pull + 1) {
    dimension(t, { t0: X.pull + 1.4, t1: DUR + 1, A: P(-RING_R - 17, RING_Y, 0), B: P(RING_R + 17, RING_Y, 0), text: '3.3 m', side: -1, id: 'w' });
    dimension(t, { t0: X.pull + 1.7, t1: DUR + 1, A: P(R0 + 90, 14, -60), B: P(R0 + 90, CH + 12, -60), ext: [[P(R0 + 10, CH + 12, -60), P(R0 + 100, CH + 12, -60)]], text: '2.4 m', side: -1, id: 'h' });
  }
  K.textBlock(t, X.endcard, DUR + 1, [
    { text: 'NEXT CASE SUNDAY', px: 92, weight: 900, y: 330, rule: 120 },
    { text: 'FOLLOW @compandgrow', px: 56, weight: 800, y: 420, col: ACC },
    { text: 'HOW MANY DAYS WOULD YOU GO IN?', px: 32, weight: 600, y: 500, family: MONO, col: INK, d: .4 },
    { text: 'COMMENT A NUMBER', px: 32, weight: 600, y: 545, family: MONO, col: ACC, d: .4 },
  ], { id: 'end' });
}
// a dark band behind top text on bright interior shots
function band(t, t0, t1) { const a = seg(t, t0, t0 + .3) * (1 - seg(t, t1 - .35, t1)); if (a <= 0) return; const c = g(); c.save(); c.globalAlpha = a; c.fillStyle = 'rgba(12,13,15,.78)'; c.fillRect(0, 290, W, 150); c.restore(); }
// f3: her watch, her pulse, her thoughts, all at the cabin clock's slow rate
function slowTrio(t) {
  const a = seg(t, T.f3 - .1, T.f3 + .3) * (1 - seg(t, END('f3') + .5, END('f3') + .9)); if (a <= 0) return;
  const c = g(); c.save(); c.globalAlpha = a; const y = 1130, xs = [220, 540, 860], slow = (t - T.f3) * .35;
  c.fillStyle = 'rgba(13,14,16,.72)'; c.fillRect(70, y - 120, 940, 260);
  c.strokeStyle = INK; c.lineWidth = 4; c.lineCap = 'round';
  // watch
  c.beginPath(); c.arc(xs[0], y, 62, 0, TAU); c.stroke(); c.fillStyle = INK; c.fillRect(xs[0] - 18, y - 92, 36, 22); c.fillRect(xs[0] - 18, y + 70, 36, 22);
  const wa = Math.floor(slow * 2) / 60 * TAU * 5; c.strokeStyle = ACC; c.beginPath(); c.moveTo(xs[0], y); c.lineTo(xs[0] + Math.sin(wa) * 50, y - Math.cos(wa) * 50); c.stroke();
  // pulse: a slow beat crawling left to right
  c.strokeStyle = ACC; c.lineWidth = 4; c.beginPath();
  for (let i = 0; i <= 120; i++) { const u = i / 120, x = xs[1] - 110 + 220 * u, ph = (u + slow * .6) % .5;
    const yy = ph > .2 && ph < .26 ? -55 * Math.sin((ph - .2) / .06 * Math.PI) : ph > .27 && ph < .3 ? 18 : 0; i ? c.lineTo(x, y + yy) : c.moveTo(x, y + yy); }
  c.stroke();
  // thought bubble with dots appearing slowly
  c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.ellipse(xs[2], y - 10, 90, 58, 0, 0, TAU); c.stroke();
  c.beginPath(); c.arc(xs[2] - 70, y + 62, 12, 0, TAU); c.stroke(); c.beginPath(); c.arc(xs[2] - 92, y + 88, 7, 0, TAU); c.stroke();
  const nd = 1 + Math.floor(slow * 2) % 3; c.fillStyle = ACC; for (let k = 0; k < nd; k++) { c.beginPath(); c.arc(xs[2] - 30 + k * 30, y - 10, 9, 0, TAU); c.fill(); }
  c.font = `600 30px ${MONO}`; c.fillStyle = DIM; c.textAlign = 'center';
  ['WATCH', 'PULSE', 'THOUGHTS'].forEach((s, k) => c.fillText(s, xs[k], y + 122));
  c.restore();
}
// f6: a back arrow on the outside clock, struck out
function noBack(t) {
  const a = seg(t, X.noback, X.noback + .3) * (1 - seg(t, X.verdict - .3, X.verdict)); if (a <= 0) return;
  const p = proj(wp(CL.out.gp, 0, 26, 2)); const c = g(); c.save(); c.globalAlpha = a; c.strokeStyle = INK; c.lineWidth = 7; c.lineCap = 'round';
  const r = 130, k = eo(seg(t, X.noback, X.noback + .5));
  c.beginPath(); c.arc(p[0], p[1], r, -Math.PI * .25, -Math.PI * .25 - Math.PI * 1.1 * k, true); c.stroke();
  const e = -Math.PI * .25 - Math.PI * 1.1 * k, ex = p[0] + Math.cos(e) * r, ey = p[1] + Math.sin(e) * r;
  c.fillStyle = INK; c.save(); c.translate(ex, ey); c.rotate(e - Math.PI / 2); c.beginPath(); c.moveTo(0, -20); c.lineTo(16, 10); c.lineTo(-16, 10); c.fill(); c.restore();
  const s = eo(seg(t, X.noback + .55, X.noback + .8)); if (s > 0) { c.strokeStyle = ACC; c.lineWidth = 12; c.beginPath(); c.moveTo(p[0] - r - 30, p[1] + r * .6); c.lineTo(p[0] - r - 30 + (2 * r + 60) * s, p[1] + r * .6 - (1.2 * r) * s); c.stroke(); }
  c.font = `900 54px ${SANS}`; c.fillStyle = INK; c.textAlign = 'center'; c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 14; c.globalAlpha = a * seg(t, X.noback + .6, X.noback + 1);
  c.fillText('NO WAY BACK', 540, 470);
  c.restore();
}

// ================================================================ sound cues (read by audio/mix.py through audio/sfx.json)
function cues() {
  // hook: outside ticks every second; inside ticks at .62 (lower, slower)
  for (let s = 1; s < T.b1 + 1; s++) sfx(s, 'tick', { gain: .9 });
  for (let k = 1; (k / .62) < T.b1 + 1; k++) sfx(k / .62, 'tock', { gain: .8 });
  sfx(T.b1 + .05, 'stamp'); sfx(at('b1', .45), 'stamp', { gain: .5 });
  [0, 1, 2].forEach(k => sfx(X.apart + k * .15, 'lift', { gain: 1 - k * .2 }));
  sfx(X.toBench, 'whoosh', { gain: .9, d: 1.0 });
  sfx(X.lift, 'lift', { gain: .7 }); sfx(X.lift + .5, 'pen');
  for (let s = 0; s < 2.6; s += .5) sfx(X.drift + s, 'tick', { gain: .7 });
  sfx(X.stairs, 'whoosh', { gain: .5 }); sfx(T.c3 + .9, 'tick');
  sfx(X.plate, 'hit', { gain: .6 }); sfx(X.well, 'dive');
  sfx(X.back, 'whoosh', { gain: 1, d: 1.2 }); sfx(T.d1, 'hit', { gain: 1 });
  [0, 1, 2, 3, 4].forEach(k => sfx(X.labels + k * .32, 'tick'));
  [2, 1, 0].forEach(k => sfx(X.close + .7 + k * .1, 'land', { gain: k === 0 ? 1 : .7 }));
  sfx(X.spin, 'hum', { d: X.pull - X.spin, gain: .8 }); sfx(X.tr2 + .2, 'rise', { d: 1.4 });
  sfx(X.spec, 'pen');
  for (const [tt, ok] of [[X.tr1, X.ok1], [X.tr2, X.ok2], [X.tr3, X.ok3]]) { sfx(tt, 'hit', { gain: .9 }); sfx(ok, 'stamp'); }
  sfx(X.vol, 'lift', { gain: .5 });
  for (let k = 0; k < 6; k++) sfx(X.week + (k + 1) / 6 * (END('e4') - .1 - X.week) * .95, 'flip');
  sfx(T.f1, 'hit', { gain: .8 }); sfx(X.inside - .2, 'dive');
  for (let s = 0; s < 3.6; s += 1.6) sfx(T.f3 + s, 'tock', { gain: .7 });
  sfx(X.hatch, 'hatch'); sfx(X.noback + .55, 'strike');
  sfx(X.verdict, 'stamp', { big: true }); sfx(T.f8 + .05, 'stamp', { gain: .6 }); sfx(at('f8', .55), 'stamp', { gain: .7 });
  sfx(X.pull, 'whoosh', { gain: 1, d: 1.2 }); sfx(X.pull + 1.0, 'land', { gain: .8 });
  sfx(X.pull + 1.4, 'pen'); sfx(X.pull + 1.7, 'pen');
  sfx(X.endcard, 'hit', { gain: .8 });
  window.CUT = X;
}

await K.boot({ dur: DUR, build, update, marks, cam: camAt, mbMax: 3 });
