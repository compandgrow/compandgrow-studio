<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lodestone</title>
</head>
<body>
<script type="module">
import * as K from './kit/dossier.js';
const { W, H, C, F, el, txt, tf, op, show, clamp, seg, lerp, E, pop, rng, measure, chars, charsPop, halftone, radial, edge, ramp, bg, mul,
        bigNum, stampEl, stampAnim, scene, sfx, SHAKES, FLASHES, WIPES, GROOVE, DARK, BOIL } = K;

const TL = await (await fetch('scenes/timeline.json')).json();
const T = TL.T, VO = TL.VO, DUR = TL.DUR;
const END = k => T[k] + VO[k];
const TAU = Math.PI * 2;

// ================================================================ props
const LW = 7;
// a rotor: rim, spokes, hub, n bar magnets (red N outward, blue S inward); rotate .rot
function rotor(parent, { r = 300, n = 12, teeth = false } = {}) {
  const g = el('g', {}, parent);
  const body = el('g', { filter: BOIL }, g);
  if (teeth) {
    let d = '';
    const nt = 36;
    for (let i = 0; i < nt; i++) {
      const a0 = i / nt * TAU, a1 = (i + .5) / nt * TAU;
      const p = (a, rr) => `${(Math.cos(a) * rr).toFixed(1)} ${(Math.sin(a) * rr).toFixed(1)}`;
      d += (i ? 'L' : 'M') + p(a0, r * 1.08) + 'L' + p(a0 + .04, r * 1.08) + 'L' + p(a1 - .04, r) + 'L' + p(a1 + TAU / nt / 2 - .04, r);
    }
    el('path', { d: d + 'Z', fill: C.cream, stroke: C.navy, 'stroke-width': LW, 'stroke-linejoin': 'round' }, body);
  }
  el('circle', { r, fill: C.cream, stroke: C.navy, 'stroke-width': LW + 2 }, body);
  const rot = el('g', {}, body);
  el('circle', { r: r * .9, fill: 'none', stroke: C.navy, 'stroke-width': 3, 'stroke-dasharray': '10 12', opacity: .5 }, rot);
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU;
    el('line', { x1: Math.cos(a) * r * .14, y1: Math.sin(a) * r * .14, x2: Math.cos(a) * r * .58, y2: Math.sin(a) * r * .58, stroke: C.navy, 'stroke-width': 9, 'stroke-linecap': 'round' }, rot);
  }
  const mags = el('g', {}, rot);
  const L = r * .3, Wd = Math.min(r * .14, r * .76 * TAU / n * .55);
  for (let i = 0; i < n; i++) {
    const m = el('g', { transform: `rotate(${(i / n * 360).toFixed(2)}) translate(${r * .76} 0)` }, mags);
    el('rect', { x: -L / 2, y: -Wd / 2, width: L / 2, height: Wd, fill: C.blue, stroke: C.navy, 'stroke-width': 4 }, m);
    el('rect', { x: 0, y: -Wd / 2, width: L / 2, height: Wd, fill: C.red, stroke: C.navy, 'stroke-width': 4 }, m);
  }
  el('circle', { r: r * .16, fill: C.navy }, rot);
  el('circle', { r: r * .06, fill: C.cream }, rot);
  // motion blur ring for fast spins (crossfades with the magnets)
  const blur = el('g', { opacity: 0 }, g);
  for (const [rr, col, w] of [[r * .76 + L * .25, C.red, Wd * .9], [r * .76 - L * .25, C.blue, Wd * .9]]) {
    el('circle', { r: rr, fill: 'none', stroke: col, 'stroke-width': w, opacity: .8 }, blur);
  }
  for (let i = 0; i < 4; i++) {
    const a0 = i / 4 * TAU + .3, a1 = a0 + 1.0, rr = r * 1.14;
    el('path', { d: `M${Math.cos(a0) * rr} ${Math.sin(a0) * rr} A${rr} ${rr} 0 0 1 ${Math.cos(a1) * rr} ${Math.sin(a1) * rr}`, fill: 'none', stroke: C.navy, 'stroke-width': 6, 'stroke-linecap': 'round' }, blur);
  }
  return { g, rot, mags, blur, r,
    set(theta, w = 0) {   // theta in radians, w = angular speed (rad/s)
      rot.setAttribute('transform', `rotate(${(theta * 180 / Math.PI).toFixed(2)})`);
      const b = clamp((Math.abs(w) - 5) / 5);
      op(mags, 1 - b * .85); op(blur, b);
      blur.setAttribute('transform', `rotate(${(theta * 180 / Math.PI).toFixed(2)})`);
    } };
}
// horseshoe magnet, opening along +x, at (x,y)
function horseshoe(parent, { s = 1, color = C.red } = {}) {
  const g = el('g', { filter: BOIL }, parent);
  const d = `M ${70 * s} ${-55 * s} L ${-10 * s} ${-55 * s} A ${55 * s} ${55 * s} 0 0 0 ${-10 * s} ${55 * s} L ${70 * s} ${55 * s}`;
  el('path', { d, fill: 'none', stroke: C.navy, 'stroke-width': 46 * s, 'stroke-linejoin': 'round' }, g);
  el('path', { d, fill: 'none', stroke: color, 'stroke-width': 32 * s }, g);
  for (const yy of [-55, 55]) el('rect', { x: 58 * s, y: (yy - 16) * s, width: 30 * s, height: 32 * s, fill: C.steel, stroke: C.navy, 'stroke-width': 5 }, g);
  return g;
}
// rotation laws
const coastStop = (t, t0, turns, dur) => {     // uniform deceleration to rest after `turns` full turns in `dur` s
  const tot = turns * TAU, w0 = 2 * tot / dur, a = w0 / dur, u = clamp(t - t0, 0, dur);
  return { th: w0 * u - .5 * a * u * u, w: t < t0 || t > t0 + dur ? 0 : w0 - a * u };
};
function wobble(t, t1) { const a = Math.max(0, t - t1); return t < t1 ? 0 : .09 * Math.exp(-a * 5) * Math.sin(a * 18); }
function tag(parent, str, { size = 40, fill = C.yellow, ink = C.navy, rot = -2, family = F.sans } = {}) {
  const g = el('g', {}, parent);
  const w = measure(str, size, family, 900) + 44, h = size * 1.5;
  el('rect', { x: -w / 2 + 7, y: -h / 2 + 7, width: w, height: h, rx: 8, fill: C.pink, class: 'mul' }, g);
  el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 8, fill, stroke: ink, 'stroke-width': 5 }, g);
  txt(g, str, { x: 0, y: size * .36, 'font-size': size, 'font-family': family, 'font-weight': 900, fill: ink, 'text-anchor': 'middle', 'letter-spacing': 1 });
  return { g, rot, w };
}
function tagAnim(tg, t, t0, x, y) { if (t < t0) { op(tg.g, 0); return; } op(tg.g, 1); tf(tg.g, x, y, pop(t, t0, .35), tg.rot); }
function rise(e, t, t0, x, y, d = .4, from = 1300, s = 1, r = 0) { op(e, t >= t0 ? 1 : 0); tf(e, x, lerp(from, y, E.back(seg(t, t0, t0 + d))), s, r); }
function popAt(e, t, t0, x, y, s = 1, r = 0, d = .35) { op(e, t >= t0 ? 1 : 0); tf(e, x, y, s * pop(t, t0, d), r); }
// headline group: small mono kicker + big slab line with misregistration shadow
function headline(g, kicker, big, { y = 430, size = 190, shadow = C.pink, fill = C.navy, sub, subFill } = {}) {
  const k = kicker ? chars(g, kicker, { x: 72, y: y - size * .98 - 14, size: 32, family: F.mono, weight: 800, fill: C.pink, ls: 3 }) : null;
  const b = chars(g, big, { x: 66, y, size, family: F.slab, fill, shadow: { fill: shadow, dx: 9, dy: 9 } });
  const s = sub ? chars(g, sub, { x: 72, y: y + 76, size: 46, family: F.sans, weight: 900, fill: subFill || fill, ls: 1 }) : null;
  return (t, t0) => { if (k) charsPop(k, t, t0, .015, .25, 20); charsPop(b, t, t0 + .1, .05, .36, 70); if (s) charsPop(s, t, t0 + .45, .012, .26, 24); };
}
function wipeAt(t, col) { WIPES.push([t, col]); sfx(t - .2, 'whoosh', .35); }
function stampCue(t, size = 'mid', shake = 14) { SHAKES.push([t, shake, size === 'big' ? .45 : .3]); sfx(t, 'stamp', size === 'big' ? 1 : .75, { big: size === 'big' }); }

// ================================================================ cut points
const CUT = {
  s1: T.b1 - .125, s2: T.c1 - .15, s3: T.d1 - .15, s4: T.d3 - .1, s5: T.e1 - .125, s6: T.f2 - .15, s7: T.g1 - .125,
  s8: T.g2 - .15, s9: T.g4 - .1, s10: T.g6 - .125, s11: T.h1 - .125, s12: T.i1 - .125, s13: T.j1 - .125,
};

async function build() {
  // ------------------------------------------------ S0 hook: the wheel that never stops (night)
  scene(0, CUT.s1, (g) => {
    bg(g, C.night);
    halftone(g, { color: C.night2, step: 24, angle: 20, f: radial(540, 860, 760, .9), maxK: .7 });
    mul(halftone(g, { color: C.blue, step: 22, angle: 70, f: radial(1080, 1900, 700, 1.1), maxK: .62 }));
    halftone(g, { color: C.yellow, step: 22, angle: 45, f: radial(0, 1750, 420, 1.3), maxK: .55 });
    const h = headline(g, 'CASE FILE CG-004', 'THE WHEEL', { y: 450, size: 128, shadow: C.pink, fill: C.cream });
    const wg = el('g', {}, g); const R = rotor(wg, { r: 300 });
    const st = horseshoe(g, { s: 1.15 });
    // NO FUEL / NO PLUG chips with red strike
    const mk = (s) => { const t = tag(g, s, { size: 46, fill: C.cream, rot: 0 }); el('line', { x1: -t.w / 2 - 10, y1: 6, x2: t.w / 2 + 10, y2: -6, stroke: C.red, 'stroke-width': 12, 'stroke-linecap': 'round' }, t.g); return t; };
    const f1 = mk('NO FUEL'), f2 = mk('NO PLUG');
    const s = stampEl(g, 'NEVER STOPS?', { size: 84, color: C.red });
    const ta = T.a2 + .15, tb = T.a2 + 1.05, ts = T.a3 + .45;
    sfx(T.a1, 'pop', .3); sfx(ta, 'pop', .4); sfx(tb, 'pop', .4); stampCue(ts, 'big', 18); FLASHES.push([ts, .45, .14]);
    return (t) => {
      h(t, -1.2);
      rise(wg, t, -.6, 540, 900, .45, 1700);
      R.set(t * 7.3 + .2, 7.3);
      popAt(st, t, -.4, 540 + 300 + 70, 900, 1, 180);
      tagAnim(f1, t, ta, 290, 1300); tagAnim(f2, t, tb, 780, 1300);
      stampAnim(s, t, ts, 540, 900, -9);
    };
  });
  wipeAt(CUT.s1, C.yellow);

  // ------------------------------------------------ S1 exhibit 01: 1269, Peregrinus' letter and wheel
  scene(CUT.s1, CUT.s2, (g) => {
    bg(g, C.paper);
    const n = bigNum(g, '01', { x: 1130, y: 1180, size: 640, fill: C.yellow, dots: C.pink });
    mul(halftone(g, { color: C.blue, step: 22, angle: 60, f: radial(0, 1920, 760, 1.3), maxK: .6 }));
    const h = headline(g, 'EXHIBIT 01', '1269', { y: 470, size: 200, sub: 'LUCERA, ITALY' });
    // the letter
    const letter = el('g', {}, g);
    const lb = el('g', { filter: BOIL }, letter);
    el('rect', { x: -230, y: -300, width: 460, height: 600, rx: 6, fill: C.cream, stroke: C.navy, 'stroke-width': LW }, lb);
    const r = rng(5);
    for (let i = 0; i < 9; i++) el('line', { x1: -180, y1: -200 + i * 44, x2: -180 + 260 + r() * 100, y2: -200 + i * 44, stroke: C.navy, 'stroke-width': 9, 'stroke-linecap': 'round', opacity: .55 }, lb);
    el('circle', { cx: 150, cy: 220, r: 46, fill: C.red, stroke: C.navy, 'stroke-width': 6 }, lb);
    txt(letter, 'EPISTOLA', { x: 0, y: -236, 'font-size': 36, 'font-family': F.mono, 'font-weight': 800, fill: C.navy, 'text-anchor': 'middle', 'letter-spacing': 3 });
    const plate = el('g', {}, g);
    el('rect', { x: -270, y: -58, width: 540, height: 116, rx: 10, fill: C.navy }, plate);
    txt(plate, 'PETER PEREGRINUS', { x: 0, y: -6, 'font-size': 42, 'font-family': F.mono, 'font-weight': 800, fill: C.cream, 'text-anchor': 'middle' });
    txt(plate, 'ENGINEER · ARMY AT LUCERA', { x: 0, y: 36, 'font-size': 24, 'font-family': F.mono, 'font-weight': 800, fill: C.yellow, 'text-anchor': 'middle', 'letter-spacing': 1 });
    // the wheel in the letter
    const wg = el('g', {}, g); const R = rotor(wg, { r: 210, n: 8, teeth: true });
    const loop = el('path', { d: 'M 150 -40 A 160 160 0 1 1 120 -100', fill: 'none', stroke: C.blue, 'stroke-width': 10, 'stroke-linecap': 'round', 'marker-end': '' }, g);
    const fe = tag(g, 'FOREVER?', { size: 46, fill: C.yellow, rot: 4 });
    const tL = T.b2 + .2, tP = T.b2 + 1.0, tW = T.b3 + .1, tF = T.b3 + 1.9;
    sfx(T.b1 + .1, 'pop', .3); sfx(tL, 'paper', .7); sfx(tP, 'pop', .35); sfx(tW, 'pop', .45); sfx(tF, 'pop', .5);
    return (t) => {
      h(t, T.b1);
      const z = lerp(1, 1.04, E.io(seg(t, CUT.s1, CUT.s2))); tf(n, (1 - z) * 900, (1 - z) * 900, z);
      const lx = lerp(330, 250, E.io(seg(t, tW - .2, tW + .4)));
      rise(letter, t, tL, lx, 930, .45, 1700, 1, lerp(-4, -8, seg(t, tW - .2, tW + .4)));
      rise(plate, t, tP, 330, 1300, .4, 1700, 1, -1.5);
      popAt(wg, t, tW, 740, 900, 1, 0, .45);
      R.set(t >= tW ? (t - tW) * 1.1 : 0, 1.1);
      op(loop, 0);
      tagAnim(fe, t, tF, 760, 640);
    };
  });
  wipeAt(CUT.s2, C.blue);

  // ------------------------------------------------ S2 exhibit 02: 1600s, Wilkins' magnet ramp
  scene(CUT.s2, CUT.s3, (g) => {
    bg(g, C.paper);
    bigNum(g, '02', { x: 1130, y: 1190, size: 520, fill: '#FFE3EA', dots: C.pink, angle: 15 });
    halftone(g, { color: C.yellow, step: 22, angle: 15, f: radial(1080, 300, 420, 1.2), maxK: .58 });
    const h = headline(g, 'EXHIBIT 02', '1600s', { y: 470, size: 190, sub: 'JOHN WILKINS · ENGLAND' });
    // apparatus: post with magnet on top, straight ramp up, hole, curved return ramp below
    const ap = el('g', {}, g);
    const ab = el('g', { filter: BOIL }, ap);
    const A = [170, 1230], Bp = [790, 760], hole = [740, 798];
    el('rect', { x: 860, y: 700, width: 34, height: 560, fill: C.cream, stroke: C.navy, 'stroke-width': LW }, ab);
    el('rect', { x: 120, y: 1250, width: 840, height: 40, fill: C.navy }, ab);
    el('line', { x1: A[0], y1: A[1], x2: Bp[0], y2: Bp[1], stroke: C.navy, 'stroke-width': 14, 'stroke-linecap': 'round' }, ab);
    el('circle', { cx: hole[0], cy: hole[1], r: 22, fill: C.paper, stroke: C.red, 'stroke-width': 5, 'stroke-dasharray': '6 6' }, ab);
    const ret = 'M 720 850 C 640 1080, 420 1000, 300 1180 Q 260 1230 190 1236';
    el('path', { d: ret, fill: 'none', stroke: C.navy, 'stroke-width': 12, 'stroke-linecap': 'round' }, ab);
    const mag = el('g', {}, ap); horseshoe(mag, { s: .9 });
    const labM = tag(g, 'MAGNET', { size: 34, fill: C.yellow, rot: 3 });
    const ball = el('g', {}, g);
    el('circle', { r: 26, fill: C.steel, stroke: C.navy, 'stroke-width': 6 }, ball);
    el('circle', { cx: -8, cy: -9, r: 7, fill: C.cream }, ball);
    const retP = el('path', { d: ret }, g); show(retP, false); const RL = retP.getTotalLength();
    // ball path: up the ramp (c2), fall through the hole, down the return (c3), up again
    const up0 = T.c2 + .5, up1 = T.c2 + 2.9, dr0 = T.c3 + .1, dr1 = T.c3 + .5, rt1 = T.c3 + 2.2, up2a = T.c3 + 2.3, up2b = T.c3 + 3.9;
    sfx(T.c1 + .1, 'pop', .3); sfx(T.c1 + 1.6, 'pop', .4); sfx(up0, 'roll', .5, { d: up1 - up0 }); sfx(dr0 + .35, 'clunk', .6); sfx(dr1, 'roll', .5, { d: rt1 - dr1 }); sfx(up2a, 'roll', .45, { d: up2b - up2a });
    const onRamp = p => [lerp(A[0], hole[0], p), lerp(A[1], hole[1], p) - 30];
    return (t) => {
      h(t, T.c1);
      rise(ap, t, T.c1 + 1.4, 0, 0, .45, 900);
      popAt(mag, t, T.c1 + 1.6, 880, 650, 1, 180);
      tagAnim(labM, t, T.c2 + .2, 900, 540);
      let p;
      if (t < up0) p = onRamp(0);
      else if (t < up1) p = onRamp(E.io(seg(t, up0, up1)));
      else if (t < dr0) p = onRamp(1);
      else if (t < dr1) { const u = seg(t, dr0, dr1); p = [hole[0] - 10 * u, hole[1] - 30 + 80 * u * u]; }
      else if (t < rt1) { const q = retP.getPointAtLength(RL * E.in(seg(t, dr1, rt1)) ** .8); p = [q.x, q.y - 28]; }
      else if (t < up2a) p = onRamp(0);
      else p = onRamp(E.io(seg(t, up2a, up2b)) * .85);
      op(ball, t >= T.c1 + 1.8 ? 1 : 0); tf(ball, p[0], p[1], pop(t, T.c1 + 1.8, .3));
    };
  });
  wipeAt(CUT.s3, C.pink);

  // ------------------------------------------------ S3 exhibit 03: 1775, the Paris Academy
  scene(CUT.s3, CUT.s4, (g) => {
    bg(g, C.paper);
    bigNum(g, '03', { x: 1130, y: 1200, size: 600, fill: C.yellow, dots: C.blue, angle: 30 });
    mul(halftone(g, { color: C.pink, step: 22, angle: 70, f: radial(0, 300, 520, 1.2), maxK: .6 }));
    const h = headline(g, 'EXHIBIT 03', '1775', { y: 470, size: 200, sub: 'PARIS ACADEMY OF SCIENCES' });
    const fol = [0, 1, 2].map(i => {
      const f = el('g', {}, g); const b = el('g', { filter: BOIL }, f);
      el('path', { d: 'M -300 -170 L -120 -170 L -90 -200 L 60 -200 L 90 -170 L 300 -170 L 300 170 L -300 170 Z', fill: i === 2 ? C.yellow : '#E9B92C', stroke: C.navy, 'stroke-width': LW, 'stroke-linejoin': 'round' }, b);
      txt(f, 'PERPETUAL MOTION', { x: 0, y: -60, 'font-size': 40, 'font-family': F.mono, 'font-weight': 800, fill: C.navy, 'text-anchor': 'middle' });
      txt(f, `PROPOSAL No. ${['311', '312', '313'][i]}`, { x: 0, y: -10, 'font-size': 28, 'font-family': F.mono, 'font-weight': 800, fill: C.navy, 'text-anchor': 'middle', opacity: .7 });
      return f;
    });
    const s = stampEl(g, 'NOT ACCEPTED', { size: 96, color: C.red });
    const tf0 = T.d1 + 2.6, ts = T.d2 + 2.1;
    sfx(T.d1 + .1, 'pop', .3); fol.forEach((_, i) => sfx(tf0 + i * .25, 'paper', .5)); stampCue(ts, 'mid', 14);
    return (t) => {
      h(t, T.d1);
      fol.forEach((f, i) => rise(f, t, tf0 + i * .25, 520 + (i - 1) * 24, 960 + (i - 1) * 40, .4, 1800, 1, (i - 1) * 3));
      stampAnim(s, t, ts, 540, 960, -9);
    };
  });
  WIPES.push([CUT.s4, C.navy]); sfx(CUT.s4 - .2, 'whoosh', .35);

  // ------------------------------------------------ S4 exhibit 04: today, the US patent office
  scene(CUT.s4, CUT.s5, (g) => {
    bg(g, C.paper);
    halftone(g, { color: C.blue, step: 22, angle: 30, f: radial(560, 980, 560, .95), maxK: .6 });
    const h = headline(g, 'EXHIBIT 04', 'TODAY', { y: 470, size: 180, sub: 'U.S. PATENT OFFICE' });
    const form = el('g', {}, g); const fb = el('g', { filter: BOIL }, form);
    el('rect', { x: -330, y: -330, width: 660, height: 660, rx: 6, fill: C.cream, stroke: C.navy, 'stroke-width': LW }, fb);
    txt(form, 'PATENT APPLICATION', { x: -280, y: -250, 'font-size': 40, 'font-family': F.mono, 'font-weight': 800, fill: C.navy });
    el('line', { x1: -280, y1: -225, x2: 280, y2: -225, stroke: C.navy, 'stroke-width': 4 }, form);
    const rows = ['DRAWINGS', 'CLAIMS', 'DESCRIPTION', 'WORKING MODEL'];
    const marks = rows.map((rw, i) => {
      const y = -140 + i * 110;
      el('rect', { x: -280, y: y - 34, width: 48, height: 48, rx: 4, fill: 'none', stroke: C.navy, 'stroke-width': 5 }, form);
      txt(form, rw, { x: -205, y: y + 2, 'font-size': 40, 'font-family': F.sans, 'font-weight': 900, fill: i === 3 ? C.red : C.navy });
      return el('path', { d: `M ${-272} ${y - 12} L ${-258} ${y + 4} L ${-226} ${y - 34}`, fill: 'none', stroke: i === 3 ? C.red : C.blue, 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, form);
    });
    const ring = el('ellipse', { cx: -20, cy: 190, rx: 300, ry: 62, fill: 'none', stroke: C.red, 'stroke-width': 8, transform: 'rotate(-3)' }, form);
    const s = stampEl(g, 'PROVE IT', { size: 120, color: C.red });
    const tfm = T.d3 + .3, tm = T.d3 + 1.6, ts = T.d3 + 3.3;
    sfx(T.d3 + .05, 'pop', .3); sfx(tfm, 'paper', .6); marks.forEach((_, i) => sfx(tm + i * .22, 'tick', .4)); stampCue(ts, 'mid', 14);
    return (t) => {
      h(t, T.d3);
      rise(form, t, tfm, 540, 1010, .42, 1900, 1, 1.5);
      marks.forEach((m, i) => op(m, t >= tm + i * .22 ? 1 : 0));
      op(ring, seg(t, tm + .9, tm + 1.1)); ring.setAttribute('stroke-dasharray', `${(seg(t, tm + .8, tm + 1.2) * 1500).toFixed(0)} 2000`);
      stampAnim(s, t, ts, 640, 1310, -8);
    };
  });
  wipeAt(CUT.s5, C.yellow);

  // ------------------------------------------------ S5 the physics: the hill, the ledger, the sticky point
  scene(CUT.s5, CUT.s6, (g) => {
    bg(g, C.paper);

    const l3 = chars(g, 'ELECTRIC MOTOR', { x: 540, y: 1270, size: 90, family: F.slab, fill: C.navy, anchor: 'middle', shadow: { fill: C.yellow, dx: 8, dy: 8 } });
    const ts = T.i1 + 1.05;
    stampCue(ts, 'big', 26); FLASHES.push([ts, .5, .14]); sfx(T.i2 + .05, 'sparkle', .5);
    return (t) => {
      tf(rays, 540, 860, 1, t * 12);
      op(rays, seg(t, ts, ts + .2));
      charsPop(k, t, CUT.s12 + .1, .015, .25, 20);
      stampAnim(s, t, ts, 540, 860, -7);
      charsPop(l2, t, T.i2 + .05, .04); charsPop(l3, t, T.i2 + .3, .035, .34, 70);
    };
  });
  wipeAt(CUT.s13, C.blue);

  // ------------------------------------------------ S13 end: the file closes; the wheel has a plug
  K.setFade(DUR - 1.3, DUR - .2);
  scene(CUT.s13, DUR + 1, (g) => {
    bg(g, C.paper);
    mul(halftone(g, { color: C.blue, step: 22, angle: 60, f: radial(1080, 1920, 900, 1.1), maxK: .6 }));
    const fol = el('g', {}, g); const fb = el('g', { filter: BOIL }, fol);
    el('path', { d: 'M -420 -330 L -160 -330 L -120 -380 L 80 -380 L 120 -330 L 420 -330 L 420 330 L -420 330 Z', fill: C.yellow, stroke: C.navy, 'stroke-width': LW, 'stroke-linejoin': 'round' }, fb);
    el('rect', { x: -300, y: 190, width: 600, height: 100, rx: 6, fill: C.cream, stroke: C.navy, 'stroke-width': 5 }, fb);
    txt(fol, 'LODESTONE · CG-004', { x: 0, y: 256, 'font-size': 42, 'font-family': F.mono, 'font-weight': 800, fill: C.navy, 'text-anchor': 'middle' });
    const wg = el('g', {}, fol); const R = rotor(wg, { r: 170, n: 12 });
    const cord = el('path', { d: 'M 170 -60 C 300 -40, 330 80, 240 120 S 120 170, 60 150', fill: 'none', stroke: C.navy, 'stroke-width': 12, 'stroke-linecap': 'round' }, fol);
    const CL = cord.getTotalLength();
    const plug = el('g', {}, fol); const pb = el('g', { filter: BOIL }, plug);
    el('rect', { x: -46, y: -34, width: 92, height: 68, rx: 14, fill: C.cream, stroke: C.navy, 'stroke-width': 6 }, pb);
    for (const y of [-16, 16]) el('rect', { x: -86, y: y - 7, width: 42, height: 14, rx: 3, fill: C.steel, stroke: C.navy, 'stroke-width': 4 }, pb);
    const h = headline(g, 'FILE CLOSED', 'NEVER STOPS', { y: 440, size: 116 });
    const pt = tag(g, 'IT HAS A PLUG.', { size: 54, fill: C.cream, rot: -3 });
    const s = stampEl(g, 'CASE CLOSED', { size: 70, color: C.red });
    const handle = txt(g, '@compandgrow', { x: 540, y: 1510, 'font-size': 40, 'font-family': F.mono, 'font-weight': 800, fill: C.navy, 'text-anchor': 'middle', 'letter-spacing': 3 });
    const tFo = CUT.s13 + .2, tPl = T.j2 + 1.0, tTg = T.j2 + 1.5, ts = T.j2 + 2.4;
    sfx(tFo, 'paper', .6); sfx(tPl, 'plop', .55); sfx(tTg, 'pop', .5); stampCue(ts, 'mid', 14); sfx(T.j1 + .1, 'pop', .3);
    return (t) => {
      h(t, T.j1);
      rise(fol, t, tFo, 540, 940, .45, 2000, 1, -1);
      tf(wg, -60, -60, 1); R.set((t - CUT.s13) * 2.2, 2.2);
      op(cord, t >= tPl - .4 ? 1 : 0); cord.setAttribute('stroke-dasharray', `${(E.out(seg(t, tPl - .4, tPl)) * CL).toFixed(0)} ${CL + 10}`);
      popAt(plug, t, tPl, 60 + 40, 150, 1, 15 + Math.sin(t * 3) * 3, .3);
      tagAnim(pt, t, tTg, 700, 1345);
      stampAnim(s, t, ts, 420, 650, -9);
      op(handle, seg(t, ts + .3, ts + .6));
    };
  });

  // ------------------------------------------------ HUD, captions, groove
  K.buildHUD('FILE No. CG-004', [
    [CUT.s1, CUT.s2, 'EXHIBIT 01', '1269'], [CUT.s2, CUT.s3, 'EXHIBIT 02', 'THE RAMP'], [CUT.s3, CUT.s4, 'EXHIBIT 03', '1775'],
    [CUT.s4, CUT.s5, 'EXHIBIT 04', 'TODAY'], [CUT.s5, CUT.s6, 'PHYSICS', 'WHY IT STOPS'], [CUT.s7, CUT.s8, 'LODESTONE', 'SPEC'],
    [CUT.s8, CUT.s9, 'TRIAL 01', 'BARE'], [CUT.s9, CUT.s10, 'TRIAL 02', 'SHIELD'], [CUT.s10, CUT.s11, 'TRIAL 03', 'COIL'],
    [CUT.s11, CUT.s12, 'NOTE', 'ONE CATCH'], [CUT.s12, CUT.s13, 'VERDICT', 'CLEARANCE'], [CUT.s13, DUR - 1.4, 'FILE', 'CLOSED'],
  ], '2026.11');
  DARK.push([0, CUT.s1]);
  K.buildCaptions(TL.subs, { x: 520, y: 1500, size: 44, maxW: 860 });
  GROOVE.push([0, CUT.s1], [CUT.s6, CUT.s7], [CUT.s12, CUT.s13]);
  window.CUT = CUT; window.TL = TL;
}
await K.boot(build, { dur: DUR, fps: 24, beat: .5 });
