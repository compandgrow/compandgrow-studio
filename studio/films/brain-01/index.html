<!-- Cards kit (1080x1920): "Real or fake?" game (answer held back), its next-day answer reveal, and "Sounds fake. It's real." fact shorts.
     mode 'game': hook + 3 exhibit cards + vote countdown + "ANSWER TOMORROW" + follow card.
     mode 'reveal': "Yesterday, one of these was real" + FAKE/REAL stamps + the real story + follow card.
     mode 'fact': hook card (claim + big icon) + 2-4 beat cards (text + stat) + payoff card + follow card.
     mode 'brain': moving challenge opener (tag + title + puzzle preview) + puzzle card with countdown ring + "COMMENT YOUR ANSWER" 3-2-1
       + "ANSWER TOMORROW" follow card. Puzzle drawing comes from puzzle.js (window.PUZZLE = {view, svg}), written by the
       piece's puzzle.py, which also computes the answer (see brain/gears.py).
     Content comes from data.js (window.DATA). Everything is a pure function of t via window.seek(t). -->

.card .kick{position:absolute;top:44px;right:56px;font-family:Mono;font-size:28px;color:var(--red);letter-spacing:2px}

.opt svg{width:1.6em;height:1.6em}
.pulse,.bob{transform-box:fill-box;transform-origin:center}
.follow{display:inline-block;background:var(--yellow);color:var(--ink);font-family:Alfa;padding:18px 40px;border-radius:999px}

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), p=(t,a,b)=>clamp((t-a)/(b-a)), eo=x=>1-Math.pow(1-x,3);

 D.items.forEach((it,i)=>{add('c'+(i+1),`<div class="card"><div class="n">${i+1}</div><div class="kick">EXHIBIT ${i+1} OF 3</div><svg viewBox="0 0 260 230"><g id="ic${i+1}"><use href="#${it.icon}"/></g></svg><h2>${it.claim}</h2><div class="stat">${it.stat}</div></div>`);seg('c'+(i+1),4.0)});

if(D.mode==='fact'){
 add('hook',`<div class="big" style="top:250px;font-size:${D.hookSize||104}px">${D.hook}</div><svg viewBox="0 0 260 230" style="position:absolute;left:190px;top:${D.hookIconTop||820}px;width:700px;height:620px"><g id="fic"><use href="#${D.icon}"/></g></svg>`); seg('hook',D.hookDur||3.0);
 D.beats.forEach((b,i)=>{add('b'+(i+1),`<div class="card"><div class="n">${i+1}</div><div class="kick">${D.kick||'THIS IS REAL'}</div><svg viewBox="0 0 260 230"><g id="bic${i+1}"><use href="#${b.icon||D.icon}"/></g></svg><h2${b.size?` style="font-size:${b.size}px"`:''}>${b.text}</h2>${b.stat?`<div class="stat">${b.stat}</div>`:''}</div>`);seg('b'+(i+1),b.dur||3.6)});
 add('pay',`<div class="big" style="top:420px;font-size:${D.payoff.size||88}px;color:var(--yellow)">${D.payoff.title}</div><div class="big" style="top:${D.payoff.bodyTop||900}px;font-size:46px;font-family:Arch;font-weight:700;line-height:1.3">${D.payoff.body}</div><div class="src">${D.sources}</div>`); seg('pay',D.payoff.dur||4.2);
}
if(D.mode==='brain'){const P=window.PUZZLE,TM=D.timer||10;
 const opts=y=>!(D.options||[]).length&&D.prompt?`<div class="opts" style="top:${y}px;font-size:${D.optSize||40}px"><div class="opt" style="background:var(--yellow)">${D.prompt}</div></div>`:(D.options||[]).length?`<div class="opts" style="top:${y}px;font-size:${D.optSize||40}px">${D.options.map(o=>`<div class="opt"><b>${o.k}</b>${o.icon?`<svg viewBox="0 0 100 100"><use href="#${o.icon}"/></svg>`:''}<span>${o.t}</span></div>`).join('')}</div>`:'';
 add('hook',`<div class="tag" id="tag">${D.tag}</div><div class="big" style="top:${D.hookTop||350}px;font-size:${D.hookSize||96}px">${D.hook}</div><svg viewBox="${P.view}" style="position:absolute;left:115px;top:${D.hookPzTop||760}px;width:850px;height:${D.hookPzH||760}px">${P.svg}</svg>`); seg('hook',D.hookDur||2.6);
 add('puz',`<div class="q">${D.question}</div><svg id="ring" viewBox="0 0 200 200" style="position:absolute;left:845px;top:180px;width:190px;height:190px"><circle cx="100" cy="100" r="84" fill="#111318" stroke="#2a3366" stroke-width="18"/><circle id="ringArc" cx="100" cy="100" r="84" fill="none" stroke="#f2c230" stroke-width="18" stroke-linecap="round" stroke-dasharray="527.8" transform="rotate(-90 100 100)"/><text id="ringN" x="100" y="128" text-anchor="middle" font-family="Alfa" font-size="84" fill="#f1e6d0"></text></svg>
  <div class="pzcard"><svg viewBox="${P.view}">${P.svg}</svg></div>${opts(1395)}${D.chip?`<div class="opts" style="top:${D.chipTop||1515}px;font-size:${D.chipSize||40}px"><div class="opt" style="background:var(--yellow)">${D.chip}</div></div>`:''}`); seg('puz',TM+0.4);
 add('lock',`<div class="big" style="top:250px;font-size:54px;font-family:Mono;color:var(--red)">TIME'S UP</div><div class="big" style="top:350px;font-size:104px">COMMENT<br>YOUR <span style="color:var(--yellow)">ANSWER</span></div><svg viewBox="${P.view}" style="position:absolute;left:330px;top:640px;width:420px;height:420px;opacity:.9">${P.svg}</svg>${opts(1090)}<div class="count" id="bcnt" style="top:1190px;font-size:220px"></div>`); seg('lock',3.6);
}
add('end',END); seg('end',3.2);
const DUR=t0;
// stamps for the reveal
if($('reveal')) D.items.forEach((it,i)=>{const s=document.createElement('div');s.className='stamp';s.id='st'+(i+1);s.textContent=it.real?'REAL':'FAKE';s.style.color=it.real?'#1f8a4c':'#e0533a';s.style.fontSize=(it.real?(i==1?84:70):64)+'px';$('r'+(i+1)).appendChild(s)});
const order=D.items.map((it,i)=>i+1).sort((a,b)=>(D.items[a-1].real?1:0)-(D.items[b-1].real?1:0)); // fakes first, real last
const hit={}; order.forEach((n,k)=>hit[n]=0.5+k*0.75); if(order.length) hit[realIdx]=0.5+0.75*1+1.0;
const XF=0.3; // push transition: the next scene slides in over the last XF s of the current one
function scene(id,t){const [a,b]=T[id];const el=$(id);const a0=id==='hook'?a:a-XF;if(t<a0-1e-3||t>=b){el.style.opacity=0;return}const k=id==='hook'?1:eo(p(t,a-XF,a)),out=id==='end'?0:eo(p(t,b-XF,b));el.style.opacity=1;el.style.transform=`translateX(${(1-k)*1080-out*1080}px)`}

// motion opener: rays + specks drift behind the hook from frame 0, hook text punches in, icon pushes in
let RS=7; const rnd=()=>{RS=(RS*16807)%2147483647;return RS/2147483647};
const SPECK=[...Array(46)].map(()=>({x:rnd()*1080,y:rnd()*1920,r:2+rnd()*5,v:20+rnd()*60}));
function fx(t){const hk=T.hook,on=t<hk[1]+0.2;const fxg=$('fx');fxg.style.opacity=on?1:0;if(!on)return;
 const cx=540,cy=(D.mode==='fact'?(D.hookIconTop||900)+300:D.mode==='brain'?(D.hookPzTop||760)+(D.hookPzH||760)/2:1100);let r='';for(let i=0;i<14;i++){const a=(i/14)*Math.PI*2+t*0.35;const a2=a+0.11;
  r+=`<path d="M${cx} ${cy} L${cx+1600*Math.cos(a)} ${cy+1600*Math.sin(a)} L${cx+1600*Math.cos(a2)} ${cy+1600*Math.sin(a2)}Z"/>`}$('rays').innerHTML=r;
 $('specks').innerHTML=SPECK.map(p=>`<circle cx="${p.x}" cy="${(p.y-p.v*t+1920*4)%1920}" r="${p.r}" opacity="0.5"/>`).join('');
 const k=t-hk[0];const hs=$('hook');if(hs){const big=hs.querySelector('.big');if(big)big.style.transform=`scale(${1+0.06*Math.exp(-k*3)*Math.cos(k*9)})`;
  const tg=$('tag');if(tg)tg.style.transform=`translateX(-50%) rotate(${-3+2*Math.sin(t*5)}deg) scale(${1+0.04*Math.sin(t*7)+0.1*Math.exp(-k*6)})`;
  const ic=hs.querySelector('svg');if(ic)ic.style.transform=`scale(${1.12-0.12*Math.min(1,k/2.5)}) rotate(${Math.sin(k*2.2)*2}deg)`}}
window.seek=t=>{
 for(const id in T) scene(id,t);
 fx(t);
 // def-level icon motion (new icons only): data-a="spin cx cy deg/s" | "flap cx cy deg hz" | "bob px hz" | "drip cx cy period" | "dash px/s"
 document.querySelectorAll('defs [data-a]').forEach(e=>{const [k,...v]=e.dataset.a.split(' '),n=v.map(Number),w=2*Math.PI;
  if(k==='dash'){e.setAttribute('stroke-dashoffset',-t*n[0]);return}
  const s=k==='drip'?1+0.45*(0.5-0.5*Math.cos(t*w/n[2])):1;
  e.setAttribute('transform',k==='spin'?`rotate(${t*n[2]} ${n[0]} ${n[1]})`:k==='flap'?`rotate(${n[2]*Math.sin(t*n[3]*w)} ${n[0]} ${n[1]})`:k==='bob'?`translate(0 ${n[0]*Math.sin(t*n[1]*w)})`:k==='drip'?`translate(${n[0]} ${n[1]}) scale(${1/Math.sqrt(s)} ${s}) translate(${-n[0]} ${-n[1]})`:'')});
 if($('fic'))$('fic').setAttribute('transform',`translate(0 ${Math.sin(t*2.2)*5})`);
 document.querySelectorAll('#hook .tile,#vote .tile').forEach((e,i)=>e.style.transform=`rotate(${(i%3-1)*3}deg) translateY(${Math.sin(t*3+i)*8}px)`);
 D.items.forEach((it,i)=>{const g=$('ic'+(i+1));if(!g)return;const lt=t-T['c'+(i+1)][0];
  const m={wheel:`rotate(${lt*40} 110 120)`,lamp:`translate(0 ${Math.sin(lt*3)*4})`,pigeon:`translate(${Math.sin(lt*2)*6} ${Math.cos(lt*2.6)*4})`,tower:`rotate(${Math.sin(lt*9)*clamp(lt/2.5)*7} 130 222)`,ship:`translate(0 ${Math.sin(lt*2)*4})`,carrier:`translate(0 ${Math.sin(lt*2.4)*5})`};
  g.setAttribute('transform',m[it.icon]||'')});
 if(T.vote){const lt=t-T.vote[0];const c=$('cnt');const on=lt>=1.0&&lt<4.0;c.textContent=on?String(3-Math.floor(lt-1.0)):'';c.style.transform=`scale(${on?1+0.25*Math.exp(-((lt-1)%1)*7):1})`;$('tmr').style.opacity=eo(p(lt,4.1,4.4))}
 if(T.puz){const TM=D.timer||10,lt=t-T.puz[0]-0.4,rem=clamp(TM-lt,0,TM),last=rem<=3;
  $('ringArc').setAttribute('stroke-dashoffset',527.8*(1-rem/TM));$('ringArc').setAttribute('stroke',last?'#e0533a':'#f2c230');
  $('ringN').textContent=String(Math.ceil(rem-1e-6)||0);$('ring').style.transform=`scale(${last&&lt>0?1+0.08*Math.exp(-((lt%1+1)%1)*6):1})`;
  document.querySelectorAll('.pulse').forEach(e=>e.style.transform=`scale(${1+0.06*Math.sin(t*6)})`);
  document.querySelectorAll('.bob').forEach(e=>e.style.transform=`translateY(${Math.sin(t*4)*6}px)`);
  const pc=document.querySelector('#puz .pzcard svg');if(pc)pc.style.transform=`scale(${1+0.03*clamp(lt/TM)})`}
 if(T.lock){const lt=t-T.lock[0],c=$('bcnt'),on=lt>=0.5&&lt<3.5;c.textContent=on?String(3-Math.floor(lt-0.5)):'';c.style.transform=`scale(${on?1+0.25*Math.exp(-((lt-0.5)%1)*7):1})`}
 if(T.reveal){const lt=t-T.reveal[0];D.items.forEach((it,i)=>{const n=i+1,h=hit[n],s=$('st'+n);s.style.opacity=lt<h?0:1;s.style.transform=`translateX(-50%) rotate(${it.real?-8:-14}deg) scale(${lt<h?2.4:2.4-1.4*eo(p(lt,h,h+0.18))})`;
   const tl=$('r'+n);tl.style.opacity=(!it.real&&lt>h+0.3)?0.55:1;tl.style.transform=it.real?`scale(${1+0.08*eo(p(lt,h,h+0.4))})`:'';const f=$('f'+n);if(f)f.style.opacity=eo(p(lt,h+0.3,h+0.6))});
  const hr=hit[realIdx];$('rTitle').style.opacity=eo(p(lt,hr+0.4,hr+0.8));$('rBody').style.opacity=eo(p(lt,hr+0.9,hr+1.3));$('rSrc').style.opacity=eo(p(lt,hr+1.2,hr+1.6))}
};
const st={whoosh:Object.keys(T).filter(k=>k!=='hook').map(k=>T[k][0]-XF/2),tick:[],stamp:[],real:[],dur:DUR,riser:null};
if(T.pay){st.stamp=[T.pay[0]+0.2]}
if(T.vote){st.tick=[1,2,3].map(k=>T.vote[0]+k);st.stamp=[T.vote[0]+4.1]}
if(T.reveal){D.items.forEach((it,i)=>(it.real?st.real:st.stamp).push(T.reveal[0]+hit[i+1]));st.riser=[T.reveal[0]-1.0,T.reveal[0]]}
if(T.puz){const TM=D.timer||10;st.tick=[...Array(TM).keys()].map(k=>T.puz[0]+0.4+k).concat([0,1,2].map(k=>T.lock[0]+0.5+k));st.stamp=[T.lock[0]];st.riser=[T.puz[1]-2.6,T.puz[1]]}
window.DUR=DUR;window.STAMPS=st;
document.fonts.ready.then(()=>{seek(0);window.ready=true});
</script></body></html>
